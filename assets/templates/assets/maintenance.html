<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asset Maintenance | ITAM</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        header {
            background: #172554;
            color: white;
            padding: 22px 6%;
        }
        main {
            max-width: 700px;
            margin: 35px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0001;
        }
        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }
        select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font: inherit;
        }
        textarea {
            min-height: 120px;
        }
        button, .back {
            display: inline-block;
            margin-top: 22px;
            padding: 12px 18px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .back {
            background: #64748b;
            margin-left: 8px;
        }
        .error {
            color: #991b1b;
            background: #fee2e2;
            padding: 12px;
        }
    </style>
</head>
<body>
<header>
    <h1>Asset Maintenance</h1>
    <p>IT Infrastructure &amp; Asset Management System</p>
</header>
<main>
    <div class="card">
        <h2>{{ asset.name }}</h2>
        <p><strong>Asset ID:</strong> {{ asset.asset_id }}</p>
        <p><strong>Current Status:</strong> {{ asset.get_status_display }}</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <label for="description">Maintenance Details *</label>
            <textarea id="description" name="description" maxlength="500"
                required placeholder="Describe the repair or service needed">{{ description|default:'' }}</textarea>

            <label for="status">Update Status *</label>
            <select id="status" name="status" required>
                <option value="Under Maintenance">Under Maintenance</option>
                <option value="Available">Available - Service Completed</option>
            </select>

            <button type="submit">Save Maintenance</button>
            <a class="back" href="{% url 'dashboard' %}">Cancel</a>
        </form>
    </div>
</main>
</body>
</html>
