
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete Asset | ITAM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
        }
        .box {
            max-width: 520px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0001;
        }
        .danger {
            background: #dc2626;
            color: white;
            border: 0;
            padding: 12px 18px;
            border-radius: 7px;
            cursor: pointer;
        }
        .cancel {
            display: inline-block;
            background: #64748b;
            color: white;
            padding: 12px 18px;
            border-radius: 7px;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Confirm Deletion</h1>
        <p>Are you sure you want to delete this asset?</p>
        <p><strong>{{ asset.asset_id }} — {{ asset.name }}</strong></p>
        <p>This action cannot be undone.</p>

        <form method="post">
            {% csrf_token %}
            <button class="danger" type="submit">Yes, Delete Asset</button>
            <a class="cancel" href="/">Cancel</a>
        </form>
    </div>
</body>
</html>
